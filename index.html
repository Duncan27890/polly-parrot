<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polly Parrot Adventure</title>
    <style>
        :root {
            --sky-blue: #a5d8ff;
            --grass-green: #91d81a;
            --hill-green: #a2e32e;
            --peppa-pink: #ffb1c1;
            --peppa-red: #e91e63;
            --house-yellow: #fff176;
            --roof-red: #ff5252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            background-color: var(--sky-blue);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 8px solid white;
            border-radius: 12px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 40px;
            border: 6px solid var(--peppa-pink);
            width: 85%;
            box-shadow: 0 12px 0 var(--peppa-pink);
        }

        .screen.visible {
            display: flex;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: var(--peppa-red);
            margin-bottom: 15px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0 white;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 1.2rem;
            line-height: 1.4;
        }

        .btn {
            background-color: #ffeb3b;
            border: 5px solid #fbc02d;
            padding: 12px 30px;
            font-size: 1.4rem;
            border-radius: 60px;
            cursor: pointer;
            color: #444;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 6px 0 #fbc02d;
            text-transform: uppercase;
            margin: 5px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #fbc02d;
        }

        #score-display {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-size: 3.5rem;
            color: white;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.15), -3px -3px 0 var(--peppa-red);
            z-index: 5;
            pointer-events: none;
        }

        .author-credit {
            font-size: 0.85rem;
            color: #888;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="score-display">0</div>
    
    <div class="ui-layer">
        <div id="start-screen" class="screen visible">
            <h1>Hooray!</h1>
            <p>It's Polly Parrot! Help her fly over the hills for some crackers.</p>
            <button class="btn" onclick="window.startGame()">Start Game</button>
            <div class="high-score" id="menu-high-score">Local Best: 0</div>
            <div class="author-credit">Created by Duncan Wylie</div>
        </div>

        <div id="game-over-screen" class="screen">
            <h1>Oh dear!</h1>
            <p>Polly had a little bump!</p>
            <div style="font-size: 2.5rem; color: var(--peppa-red); margin-bottom: 10px;" id="final-score">0</div>
            <button class="btn" onclick="window.startGame()">Play Again</button>
            <div class="high-score" id="over-high-score">Local Best: 0</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreTxt = document.getElementById('final-score');
    const menuHighScore = document.getElementById('menu-high-score');
    const overHighScore = document.getElementById('over-high-score');

    const GRAVITY = 0.24;
    const FLAP_STRENGTH = -5.8;
    const PIPE_SPEED = 2.8;
    const PIPE_SPAWN_RATE = 90; 
    const PIPE_GAP = 190;
    const PIPE_WIDTH = 80;

    let bird, pipes, score, highScore, gameState, frameCount, backgroundX = 0;
    let audioCtx;

    gameState = 'START';
    highScore = localStorage.getItem('pollyHighScore') || 0;
    updateHighScoreUI();

    function updateHighScoreUI() {
        menuHighScore.innerText = `Local Best: ${highScore}`;
        overHighScore.innerText = `Local Best: ${highScore}`;
    }

    async function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
    }

    function playFlapSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    class Bird {
        constructor() { this.reset(); }
        reset() {
            this.x = 100;
            this.y = canvas.height / 2;
            this.velocity = 0;
            this.radius = 18;
            this.rotation = 0;
        }
        update() {
            this.velocity += GRAVITY;
            this.y += this.velocity;
            this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.08));
            if (this.y + this.radius > canvas.height - 40) endGame();
            if (this.y - this.radius < 0) { this.y = this.radius; this.velocity = 0; }
        }
        flap() { this.velocity = FLAP_STRENGTH; playFlapSound(); }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
            ctx.fillStyle = '#4caf50'; ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(0, 0, 24, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.moveTo(18, -6); ctx.quadraticCurveTo(35, 0, 18, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(10, -8, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(12, -8, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#81c784'; ctx.beginPath(); ctx.ellipse(-10, 4, 14, 9, Math.PI/6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.restore();
        }
    }

    class Pipe {
        constructor(x) {
            this.x = x;
            this.topHeight = Math.random() * (canvas.height - PIPE_GAP - 200) + 80;
            this.bottomY = this.topHeight + PIPE_GAP;
            this.passed = false;
            this.color = ['#ff8a80', '#80d8ff', '#ccff90', '#ffff8d'][Math.floor(Math.random() * 4)];
        }
        update() { this.x -= PIPE_SPEED; }
        draw() {
            ctx.lineWidth = 5; ctx.strokeStyle = '#555'; ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.roundRect(this.x, 0, PIPE_WIDTH, this.topHeight, [0, 0, 15, 15]); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.roundRect(this.x, this.bottomY, PIPE_WIDTH, canvas.height - this.bottomY, [15, 15, 0, 0]); ctx.fill(); ctx.stroke();
        }
    }

    function resize() {
        const container = document.getElementById('game-container');
        if (!container) return;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.startGame = async () => {
        await initAudio();
        bird = new Bird();
        pipes = []; score = 0; frameCount = 0; gameState = 'PLAYING';
        scoreDisplay.innerText = '0';
        startScreen.classList.remove('visible');
        gameOverScreen.classList.remove('visible');
    };

    function endGame() {
        if (gameState === 'GAMEOVER') return;
        gameState = 'GAMEOVER';
        finalScoreTxt.innerText = score;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('pollyHighScore', highScore);
            updateHighScoreUI();
        }
        gameOverScreen.classList.add('visible');
    }

    function handleInput() { if (gameState === 'PLAYING') bird.flap(); }
    window.addEventListener('mousedown', (e) => { if (e.target.tagName !== 'BUTTON') handleInput(); });
    window.addEventListener('touchstart', (e) => { if (e.target.tagName !== 'BUTTON') { e.preventDefault(); handleInput(); } }, { passive: false });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') handleInput(); });

    function drawBackground() {
        backgroundX = (backgroundX - 0.5) % (canvas.width * 2);
        ctx.fillStyle = '#fff176'; ctx.beginPath(); ctx.arc(canvas.width - 70, 80, 40, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#a2e32e'; ctx.beginPath(); ctx.arc(canvas.width / 2 + (backgroundX * 0.3), canvas.height + 150, 450, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d4e157'; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.strokeStyle = '#827717'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, canvas.height - 40); ctx.lineTo(canvas.width, canvas.height - 40); ctx.stroke();
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        if (gameState === 'PLAYING') {
            frameCount++;
            if (frameCount % PIPE_SPAWN_RATE === 0) pipes.push(new Pipe(canvas.width));
            bird.update();
            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i]; p.update(); p.draw();
                if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH && (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.bottomY)) endGame();
                if (!p.passed && bird.x > p.x + PIPE_WIDTH) { p.passed = true; score++; scoreDisplay.innerText = score; }
                if (p.x + PIPE_WIDTH < 0) pipes.splice(i, 1);
            }
            bird.draw();
        } else {
            if (bird) {
                bird.y = canvas.height/2 + Math.sin(Date.now() / 300) * 15;
                bird.draw();
            } else { bird = new Bird(); }
        }
        requestAnimationFrame(loop);
    }

    window.onload = () => { loop(); };
</script>
</body>
</html>
